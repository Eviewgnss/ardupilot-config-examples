# Eview HB6 Pro / HB56H (mosaic-H) and HB10 (AsteRx-m3 Pro+) dual-antenna heading - septentrio_gnss_driver (ROS 2)
# Starting point only. Keys follow the driver's config/rover.yaml; unlisted keys keep driver defaults.
# Launch: ros2 launch septentrio_gnss_driver rover_node.launch.py file_name:=hb6-pro-heading.yaml

device: tcp://192.168.3.1:28784
# device: serial:/dev/ttyACM0

serial:
  baudrate: 921600
  hw_flow_control: "off"

configure_rx: true

frame_id: gnss
vehicle_frame_id: base_link
local_frame_id: odom
use_ros_axis_orientation: true

receiver_type: gnss
multi_antenna: true
datum: Default

# Heading is measured along the main -> aux antenna baseline. If that baseline is not
# aligned with the vehicle's forward axis, set the offset angles here (degrees).
# Check the receiver manual for the sign convention.
att_offset:
  heading: 0.0
  pitch: 0.0

polling_period:
  pvt: 100
  rest: 500

rtk_settings:
  ntrip_1:
    id: "NTR1"
    caster: ""
    caster_port: 2101
    username: ""
    password: ""
    mountpoint: ""
    version: "v2"
    tls: false
    fingerprint: ""
    rtk_standard: "auto"
    send_gga: "auto"
    keep_open: true

publish:
  auto_publish: false
  publish_only_valid: false
  navsatfix: true
  gpsfix: true
  pvtgeodetic: true
  poscovgeodetic: true
  velcovgeodetic: true
  atteuler: true         # heading and pitch from the two antennas
  attcoveuler: true      # heading/pitch covariance
  aimplusstatus: true
  diagnostics: true
